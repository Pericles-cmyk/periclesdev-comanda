services:
  db:
    image: postgres:17-alpine
    container_name: periclesdev-comanda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: comanda_local
      POSTGRES_USER: comanda
      POSTGRES_PASSWORD: comanda_local_2026
      TZ: America/Recife
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - periclesdev_comanda_db:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comanda -d comanda_local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  periclesdev_comanda_db:
